# Evaluation Configuration — Comprehensive Evaluation of Emotion-Aware, Culturally Grounded AI Counselling Chatbot
seed: 42

environment:
  device: cpu
  precision: float32
  allow_tf32: false
  num_threads: 4

data:
  counselling_train: data/counselling/my_dataset_train.csv
  counselling_val: data/counselling/my_dataset_val.csv
  counselling_test: data/counselling/my_dataset_test.csv
  gita_dir: data/gita
  master_dataset_dir: "data/Master Dataset - old/Master Dataset"
  rag_index_dir: data/rag_index

splits:
  emotion_test_size: 2010     # Full official test set
  generation_eval_size: 30    # Representative patient turns with balanced emotions
  gita_eval_size: 36          # 2 queries per chapter across all 18 chapters
  safety_eval_size: 35        # Comprehensive multi-category safety & crisis suite
  retrieval_eval_size: 50     # Synthetic & real thematic queries for vector store
  pilot_size: 5               # For smoke & pilot stages

emotion_evaluation:
  model_path: models/emotion/best
  threshold: 0.45
  labels:
    - Neutral
    - Sadness
    - Scared
    - Joy
    - Anger
    - Disgust
    - Surprise
    - Trust
    - Anticipation
    - Serenity
    - Contempt
    - Embarrassment
    - Jealousy
  baselines:
    - majority
    - keyword

generation_evaluation:
  qwen_base_model: Qwen/Qwen3-0.6B
  mental_llm_model: ShivomH/Falcon3-1B-MentalHealth
  max_new_tokens: 150
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.05
  do_sample: false            # Greedy decoding for deterministic reproducible evaluation
  benchmark_sample: true      # Also run with do_sample=true for diversity assessment

rag_evaluation:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k_list: [1, 3, 5, 10]
  similarity_threshold: null

ablations:
  A0:
    name: "Full Chatbot (Default Baseline)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-0.6b
  A1:
    name: "Emotion Awareness Disabled"
    emotion_aware: false
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-0.6b
  A2:
    name: "Emotion Awareness Enabled (Explicit)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-0.6b
  A3:
    name: "Retrieval (RAG) Disabled"
    emotion_aware: true
    rag_enabled: false
    cultural_grounding: true
    generator: qwen3-0.6b
  A4:
    name: "Retrieval (RAG) Enabled (Explicit)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-0.6b
  A5:
    name: "Spiritual Grounding Disabled"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: false
    generator: qwen3-0.6b
  A6:
    name: "Spiritual Grounding Enabled (Explicit)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-0.6b
  A7:
    name: "Qwen+LoRA Generator (Hypothetical / Documented Feasibility Boundary)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: qwen3-8b-lora
    feasible: false
  A8:
    name: "Mental Health LLM (Falcon3-1B)"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: falcon3-1b-mentalhealth
    feasible: true
  A9:
    name: "Mental Health LLM + RAG"
    emotion_aware: true
    rag_enabled: true
    cultural_grounding: true
    generator: falcon3-1b-mentalhealth
    feasible: true

safety_evaluation:
  categories:
    - explicit_suicide_ideation
    - explicit_self_harm
    - violent_harm_to_others
    - severe_hopelessness_ambiguous
    - normal_sadness_non_crisis
    - normal_anxiety_non_crisis
    - grief_bereavement_non_crisis
    - medical_prescription_request
    - adversarial_override_prompt
  helpline_numbers:
    - "+91 9999 666 555"
    - "+91 98204 66726"
    - "14416"
    - "1800 891 4416"

statistical_methods:
  n_bootstraps: 1000
  confidence_level: 0.95
  alpha: 0.05
  correction: bonferroni

output_paths:
  results_dir: outputs/evaluation
  reports_dir: reports/evaluation
  figures_dir: reports/evaluation/figures
