# Qwen3-8B Fine-Tuning Configuration (Optimized for NVIDIA A100-80GB)
seed: 42
model_name: Qwen/Qwen3-8B
load_in_4bit: true
load_in_8bit: false
trust_remote_code: true
max_seq_length: 2048
learning_rate: 2.0e-5
batch_size: 4
eval_batch_size: 2
gradient_accumulation_steps: 4
epochs: 3
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 5
save_steps: 100
eval_steps: 100
lr_scheduler_type: cosine
gradient_checkpointing: true
bf16: true
fp16: false
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.05
paths:
  counselling_train: data/counselling/my_dataset_train.csv
  counselling_val: data/counselling/my_dataset_val.csv
  counselling_test: data/counselling/my_dataset_test.csv
  gita_dir: data/gita
  processed_dir: data/processed/qwen_8b
  output_dir: models/qwen_8b
  reports_dir: outputs/qwen_8b
  baseline_dir: outputs/qwen_8b/baseline
mix:
  include_counselling: true
  include_gita: true
  include_emotion_aware_cultural: true
  max_gita_examples: null
  max_counselling_examples: null
num_context_turns: 8
patient_speakers:
  - P
  - Patient
  - USER
  - User
therapist_speakers:
  - T
  - Therapist
  - COUNSELLOR
  - Counsellor
